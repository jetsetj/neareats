<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>근처맛집</title>
  <script src="./env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --accent: #58a6ff;
      --star: #f0b429;
      --tree-line: #30363d;
      --panel-bg: #161b22;
      --border: #30363d;
    }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--fg);
      padding: 20px;
      min-height: 100vh;
      line-height: 1.6;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }
    
    h1 {
      font-size: 1.3rem;
      color: var(--accent);
    }
    
    .controls {
      display: flex;
      gap: 10px;
    }
    
    button {
      font-family: inherit;
      background: var(--panel-bg);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    
    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .search-box {
      margin-bottom: 20px;
    }
    
    .search-box input {
      width: 100%;
      font-family: inherit;
      background: var(--panel-bg);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    
    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .tree {
      font-size: 0.95rem;
    }
    
    .store {
      margin-bottom: 15px;
    }
    
    .store-header {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    
    .store-header:hover {
      background: var(--panel-bg);
    }
    
    .store-name {
      color: var(--fg);
      font-weight: 600;
    }
    
    .store-rating {
      color: var(--star);
    }
    
    .store-actions {
      margin-left: auto;
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .store-header:hover .store-actions {
      opacity: 1;
    }
    
    .store-actions button {
      padding: 2px 6px;
      font-size: 0.75rem;
    }
    
    .menu-list {
      margin-left: 24px;
      padding-left: 16px;
      border-left: 1px solid var(--tree-line);
      display: none;
    }
    
    .store.expanded .menu-list {
      display: block;
    }
    
    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }
    
    .menu-item:hover {
      background: var(--panel-bg);
    }
    
    .menu-item:hover .menu-actions {
      opacity: 1;
    }
    
    .menu-price {
      color: #8b949e;
      min-width: 90px;
    }
    
    .menu-rating {
      color: var(--star);
    }
    
    .menu-count {
      color: #8b949e;
      font-size: 0.85rem;
    }
    
    .menu-actions {
      margin-left: auto;
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .menu-actions button {
      padding: 2px 6px;
      font-size: 0.75rem;
    }
    
    .expand-icon {
      transition: transform 0.2s;
      font-size: 0.8rem;
    }
    
    .store.expanded .expand-icon {
      transform: rotate(90deg);
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
    }
    
    .modal h2 {
      margin-bottom: 15px;
      font-size: 1.1rem;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.85rem;
      color: #8b949e;
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      font-family: inherit;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .star-rating {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .star-rating button {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 1.6rem;
      line-height: 1;
      color: #444c56;
      cursor: pointer;
    }

    .star-rating button.filled {
      color: var(--star);
    }

    .star-rating button.half {
      background: linear-gradient(90deg, var(--star) 50%, #444c56 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    .rating-value {
      margin-left: 8px;
      color: #8b949e;
      font-size: 0.85rem;
    }
    
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    
    .btn-primary:hover {
      background: #79b8ff;
    }
    
    .btn-danger {
      color: #f85149;
      border-color: #f85149;
    }
    
    .btn-danger:hover {
      background: rgba(248,81,73,0.1);
    }
    
    .sort-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    
    .sort-controls button {
      font-size: 0.8rem;
      padding: 4px 10px;
    }
    
    .sort-controls button.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
    
    .error-banner {
      background: rgba(248,81,73,0.1);
      border: 1px solid #f85149;
      color: #f85149;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .setup-guide {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .setup-guide h2 {
      color: var(--accent);
      margin-bottom: 15px;
    }
    
    .setup-guide code {
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.85rem;
    }
    
    .setup-guide ol {
      margin-left: 20px;
      line-height: 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📍 근처맛집</h1>
      <div class="controls">
        <button onclick="testDbConnection()">DB 테스트</button>
        <button onclick="showAddStoreModal()">+ 가게 추가</button>
      </div>
    </header>
    
    <div id="errorBanner" class="error-banner" style="display:none;"></div>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="가게 또는 메뉴 검색..." oninput="render()">
    </div>
    
    <div class="sort-controls">
      <button class="active" onclick="setSort('name')">가나다</button>
      <button onclick="setSort('rating')">별점순</button>
      <button onclick="setSort('count')">방문순</button>
    </div>
    
    <div class="tree" id="tree">
      <div class="loading">데이터를 불러오는 중...</div>
    </div>
  </div>
  
  <div class="modal-overlay" id="storeModal">
    <div class="modal">
      <h2 id="storeModalTitle">가게 추가</h2>
      <div class="form-group">
        <label>가게 이름</label>
        <input type="text" id="storeName" placeholder="예: 고기리 막창">
      </div>
      <div class="modal-buttons">
        <button onclick="closeModal('storeModal')">취소</button>
        <button class="btn-primary" id="saveStoreBtn" onclick="saveStore()">저장</button>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="menuModal">
    <div class="modal">
      <h2 id="menuModalTitle">메뉴 추가</h2>
      <div class="form-group">
        <label>메뉴 이름</label>
        <input type="text" id="menuName" placeholder="예: 삼겹살">
      </div>
      <div class="form-group">
        <label>가격 (원)</label>
        <input type="number" id="menuPrice" placeholder="예: 15000">
      </div>
      <div class="modal-buttons">
        <button onclick="closeModal('menuModal')">취소</button>
        <button class="btn-primary" id="saveMenuBtn" onclick="saveMenu()">저장</button>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="ratingModal">
    <div class="modal">
      <h2 id="ratingModalTitle">별점 입력</h2>
      <p id="ratingMenuName" style="margin-bottom: 15px; color: #8b949e;"></p>
      <div class="form-group">
        <label>별점</label>
        <div class="star-rating" id="starRating" role="radiogroup" aria-label="별점 선택">
          <button type="button" data-star="1" aria-label="1점">★</button>
          <button type="button" data-star="2" aria-label="2점">★</button>
          <button type="button" data-star="3" aria-label="3점">★</button>
          <button type="button" data-star="4" aria-label="4점">★</button>
          <button type="button" data-star="5" aria-label="5점">★</button>
          <span class="rating-value" id="ratingValueText">0.0 ★</span>
        </div>
      </div>
      <div class="modal-buttons">
        <button onclick="closeModal('ratingModal')">취소</button>
        <button class="btn-primary" id="saveRatingBtn" onclick="saveRating()">저장</button>
      </div>
    </div>
  </div>

  <script>
    var supabase = null;
    let initDebugMessage = '';

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = src;
        el.async = true;
        el.onload = () => resolve(true);
        el.onerror = () => reject(new Error(`load failed: ${src}`));
        document.head.appendChild(el);
      });
    }

    async function ensureSupabaseLibrary() {
      if (window.supabase) return true;
      const candidates = [
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
        'https://unpkg.com/@supabase/supabase-js@2',
        'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.49.8/umd/supabase.min.js'
      ];

      for (const src of candidates) {
        try {
          await loadScript(src);
          if (window.supabase) return true;
        } catch (_e) {
          // 다음 CDN 시도
        }
      }
      return Boolean(window.supabase);
    }
    
    async function initializeSupabase() {
      const libOk = await ensureSupabaseLibrary();
      // 1) local env.js 2) localStorage 3) Vercel /api/config 순서로 보완
      let url = window.env?.SUPABASE_URL || localStorage.getItem('supabase_url') || '';
      let key = window.env?.SUPABASE_ANON_KEY || localStorage.getItem('supabase_anon_key') || '';
      let source = (window.env?.SUPABASE_URL && window.env?.SUPABASE_ANON_KEY) ? 'env.js' : '';
      let apiError = '';

      try {
        const res = await fetch('/api/config', { cache: 'no-store' });
        if (res.ok) {
          const ct = res.headers.get('content-type') || '';
          if (ct.includes('application/json')) {
            const cfg = await res.json();
            if (cfg?.SUPABASE_URL && cfg?.SUPABASE_ANON_KEY) {
              url = cfg.SUPABASE_URL;
              key = cfg.SUPABASE_ANON_KEY;
              source = '/api/config';
            }
          } else {
            apiError = '/api/config 응답이 JSON이 아닙니다.';
          }
        } else {
          apiError = `/api/config HTTP ${res.status}`;
        }
      } catch (_e) {
        // 로컬 파일 실행(file://) 등에서 /api가 없을 수 있음
        apiError = '/api/config 요청 실패';
      }

      if (url && key && libOk && window.supabase) {
        supabase = window.supabase.createClient(url, key);
        initDebugMessage = `초기화 성공 (${source || 'localStorage'})`;
      } else {
        const missing = [];
        if (!url) missing.push('SUPABASE_URL');
        if (!key) missing.push('SUPABASE_ANON_KEY');
        if (!libOk || !window.supabase) missing.push('supabase-js CDN');
        initDebugMessage =
          `초기화 실패: ${missing.join(', ') || '알 수 없음'}` +
          (apiError ? ` / ${apiError}` : '');
      }
    }
    
    let data = { stores: [] };
    let currentStoreId = null;
    let currentMenuId = null;
    let currentRatingTarget = 'menu';
    let currentRatingValue = 5;
    let sortBy = 'name';
    let editingStoreId = null;
    let editingMenuId = null;
    let isLoading = false;

    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      banner.textContent = msg;
      banner.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBanner').style.display = 'none';
    }

    async function loadData() {
      if (!supabase) {
        document.getElementById('tree').innerHTML = `
          <div class="setup-guide">
            <h2>⚠️ Supabase 연결 필요</h2>
            <ol>
              <li>Supabase 프로젝트 생성: <a href="https://supabase.com" target="_blank" style="color: var(--accent);">supabase.com</a></li>
              <li>SQL Editor에서 <code>schema.sql</code> 실행</li>
              <li>Settings → API에서 URL과 anon key 확인</li>
              <li>프로젝트 루트의 <code>env.js</code>에 URL/Key를 한 번만 입력 (권장)</li>
              <li>또는 아래 입력창에 입력 후 저장</li>
            </ol>
            <div class="form-group">
              <label>Supabase URL</label>
              <input type="text" id="supabaseUrl" placeholder="https://xxxxx.supabase.co">
            </div>
            <div class="form-group">
              <label>Supabase Anon Key</label>
              <input type="text" id="supabaseKey" placeholder="eyJxxxxx">
            </div>
            <button class="btn-primary" onclick="saveSupabaseConfig()">연결하기</button>
          </div>
        `;
        return;
      }
      
      try {
        isLoading = true;
        
        const { data: stores, error } = await supabase
          .from('stores')
          .select('*')
          .order('name');
        
        if (error) throw error;
        
        data.stores = [];
        
        for (const store of stores) {
          const { data: menus } = await supabase
            .from('menus')
            .select('*')
            .eq('store_id', store.id)
            .order('name');
          
          const menusWithRatings = [];
          for (const menu of menus || []) {
            const { data: ratings } = await supabase
              .from('ratings')
              .select('*')
              .eq('menu_id', menu.id)
              .order('rated_at', { ascending: false });
            
            menusWithRatings.push({
              id: menu.id,
              store_id: menu.store_id,
              name: menu.name,
              price: menu.price,
              ratings: ratings || []
            });
          }
          
          const { data: fetchedStoreRatings, error: storeRatingError } = await supabase
            .from('store_ratings')
            .select('*')
            .eq('store_id', store.id)
            .order('created_at', { ascending: false })
            .limit(1);

          if (storeRatingError && !String(storeRatingError.message || '').includes('store_ratings')) {
            throw storeRatingError;
          }
          const storeLastRating = fetchedStoreRatings?.[0]?.rating || 0;

          data.stores.push({
            id: store.id,
            name: store.name,
            menus: menusWithRatings,
            store_rating: Number(storeLastRating) || 0
          });
        }
        
        hideError();
      } catch (error) {
        console.error('Error loading data:', error);
        showError('데이터 로드 실패: ' + error.message);
      } finally {
        isLoading = false;
      }
    }

    async function testDbConnection() {
      if (!supabase) {
        await initializeSupabase();
      }
      if (!supabase) {
        alert(
          'Supabase가 연결되지 않았습니다.\n' +
          initDebugMessage + '\n\n' +
          'Vercel이라면 /api/config URL이 JSON을 반환하는지 확인하세요.'
        );
        return;
      }
      
      try {
        const { data, error } = await supabase
          .from('stores')
          .select('*')
          .limit(1);
        
        if (error) throw error;
        
        alert('✅ DB 연결 성공!\n테이블 접근 정상');
      } catch (error) {
        alert('❌ DB 연결 실패\n' + error.message);
      }
    }

    function saveSupabaseConfig() {
      const url = document.getElementById('supabaseUrl').value.trim();
      const key = document.getElementById('supabaseKey').value.trim();
      
      if (!url || !key) {
        alert('URL과 Key를 모두 입력해주세요.');
        return;
      }
      
      localStorage.setItem('supabase_url', url);
      localStorage.setItem('supabase_anon_key', key);
      
      window.location.reload();
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function calculateWeightedRating(ratings) {
      if (!ratings || ratings.length === 0) return 0;
      let totalWeight = 0;
      let totalScore = 0;
      ratings.forEach((r, i) => {
        const weight = i + 1;
        totalWeight += weight;
        totalScore += r.rating * weight;
      });
      return totalScore / totalWeight;
    }

    function getMenuStats(menu) {
      const avgRating = calculateWeightedRating(menu.ratings);
      const count = menu.ratings ? menu.ratings.length : 0;
      return { avgRating, count };
    }

    function getStoreRating(store) {
      return Number(store.store_rating || 0);
    }

    function getStoreVisitCount(store) {
      return (store.menus || []).reduce((sum, m) => {
        return sum + ((m.ratings || []).length);
      }, 0);
    }

    function formatPrice(price) {
      return parseInt(price || 0).toLocaleString() + '원';
    }

    function formatRating(rating) {
      return rating.toFixed(1);
    }

    function setSort(sort) {
      sortBy = sort;
      document.querySelectorAll('.sort-controls button').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      render();
    }

    function render() {
      const tree = document.getElementById('tree');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      if (isLoading) {
        tree.innerHTML = '<div class="loading">데이터를 불러오는 중...</div>';
        return;
      }
      
      let stores = data.stores.filter(s => {
        if (search && !s.name.toLowerCase().includes(search)) {
          const menuMatch = s.menus.some(m => m.name.toLowerCase().includes(search));
          if (!menuMatch) return false;
        }
        return true;
      });

      if (sortBy === 'name') {
        stores.sort((a, b) => a.name.localeCompare(b.name));
      } else if (sortBy === 'rating') {
        stores.sort((a, b) => getStoreRating(b) - getStoreRating(a));
      } else if (sortBy === 'count') {
        stores.sort((a, b) => {
          const aCount = getStoreVisitCount(a);
          const bCount = getStoreVisitCount(b);
          return bCount - aCount;
        });
      }

      if (stores.length === 0) {
        tree.innerHTML = '<div class="empty-state">아직 등록된 가게가 없습니다.<br>"+ 가게 추가"를 눌러 시작하세요!</div>';
        return;
      }

      tree.innerHTML = stores.map(store => {
        const storeRating = getStoreRating(store);
        const storeVisitCount = getStoreVisitCount(store);
        
        return `
          <div class="store" data-store-id="${store.id}">
            <div class="store-header" onclick="toggleStore('${store.id}')">
              <span class="expand-icon">▶</span>
              <span class="store-name">${store.name}</span>
              <span class="store-rating">
                ${storeRating > 0 ? formatRating(storeRating) + '★ ' : ''}
                ${storeVisitCount > 0 ? '[' + storeVisitCount + '회]' : ''}
              </span>
              <div class="store-actions" onclick="event.stopPropagation()">
                <button onclick="showStoreRatingModal('${store.id}')">별점</button>
                <button onclick="showAddMenuModal('${store.id}')">+ 메뉴</button>
                <button onclick="editStore('${store.id}')">수정</button>
                <button class="btn-danger" onclick="deleteStore('${store.id}')">삭제</button>
              </div>
            </div>
            <div class="menu-list">
              ${store.menus.length === 0 ? '<div style="color:#8b949e;padding:10px;">메뉴를 추가하세요</div>' : store.menus.map(menu => {
                const stats = getMenuStats(menu);
                return `
                  <div class="menu-item">
                    <span class="menu-name">${menu.name}</span>
                    <span class="menu-price">${formatPrice(menu.price)}</span>
                    <span class="menu-rating">${stats.count > 0 ? formatRating(stats.avgRating) + '★' : ''}</span>
                    <span class="menu-count">[${stats.count}회]</span>
                    <div class="menu-actions">
                      <button onclick="showRatingModal('${store.id}', '${menu.id}')">별점</button>
                      <button onclick="editMenu('${store.id}', '${menu.id}')">수정</button>
                      <button class="btn-danger" onclick="deleteMenu('${store.id}', '${menu.id}')">삭제</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleStore(storeId) {
      const store = data.stores.find(s => s.id === storeId);
      if (store) {
        const storeEl = document.querySelector(`[data-store-id="${storeId}"]`);
        storeEl.classList.toggle('expanded');
      }
    }

    function showAddStoreModal() {
      editingStoreId = null;
      document.getElementById('storeModalTitle').textContent = '가게 추가';
      document.getElementById('storeName').value = '';
      document.getElementById('storeModal').classList.add('active');
    }

    function editStore(storeId) {
      const store = data.stores.find(s => s.id === storeId);
      if (!store) return;
      editingStoreId = storeId;
      document.getElementById('storeModalTitle').textContent = '가게 수정';
      document.getElementById('storeName').value = store.name;
      document.getElementById('storeModal').classList.add('active');
    }

    async function saveStore() {
      if (!supabase) {
        alert('Supabase가 연결되지 않았습니다. DB 연결 후 다시 시도해주세요.');
        return;
      }
      
      const name = document.getElementById('storeName').value.trim();
      if (!name) return;
      
      const btn = document.getElementById('saveStoreBtn');
      btn.disabled = true;
      btn.textContent = '저장 중...';
      
      try {
        if (editingStoreId) {
          const { error } = await supabase
            .from('stores')
            .update({ name, updated_at: new Date().toISOString() })
            .eq('id', editingStoreId);
          
          if (error) throw error;
        } else {
          const { error } = await supabase
            .from('stores')
            .insert({ name });
          
          if (error) throw error;
        }
        
        closeModal('storeModal');
        await loadData();
        render();
      } catch (error) {
        alert('저장 실패: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '저장';
      }
    }

    async function deleteStore(storeId) {
      if (!supabase) {
        alert('Supabase가 연결되지 않았습니다.');
        return;
      }
      if (!confirm('가게를 삭제하시겠습니까?')) return;
      
      try {
        const { error } = await supabase
          .from('stores')
          .delete()
          .eq('id', storeId);
        
        if (error) throw error;
        
        await loadData();
        render();
      } catch (error) {
        alert('삭제 실패: ' + error.message);
      }
    }

    function showAddMenuModal(storeId) {
      currentStoreId = storeId;
      editingMenuId = null;
      document.getElementById('menuModalTitle').textContent = '메뉴 추가';
      document.getElementById('menuName').value = '';
      document.getElementById('menuPrice').value = '';
      document.getElementById('menuModal').classList.add('active');
    }

    function editMenu(storeId, menuId) {
      const store = data.stores.find(s => s.id === storeId);
      if (!store) return;
      const menu = store.menus.find(m => m.id === menuId);
      if (!menu) return;
      
      currentStoreId = storeId;
      editingMenuId = menuId;
      document.getElementById('menuModalTitle').textContent = '메뉴 수정';
      document.getElementById('menuName').value = menu.name;
      document.getElementById('menuPrice').value = menu.price;
      document.getElementById('menuModal').classList.add('active');
    }

    async function saveMenu() {
      if (!supabase) {
        alert('Supabase가 연결되지 않았습니다.');
        return;
      }
      
      const name = document.getElementById('menuName').value.trim();
      const price = document.getElementById('menuPrice').value.trim();
      if (!name) return;
      
      const btn = document.getElementById('saveMenuBtn');
      btn.disabled = true;
      btn.textContent = '저장 중...';
      
      try {
        if (editingMenuId) {
          const { error } = await supabase
            .from('menus')
            .update({ name, price: parseInt(price) || 0 })
            .eq('id', editingMenuId);
          
          if (error) throw error;
        } else {
          const { error } = await supabase
            .from('menus')
            .insert({ store_id: currentStoreId, name, price: parseInt(price) || 0 });
          
          if (error) throw error;
        }
        
        closeModal('menuModal');
        await loadData();
        render();
      } catch (error) {
        alert('저장 실패: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '저장';
      }
    }

    async function deleteMenu(storeId, menuId) {
      if (!supabase) {
        alert('Supabase가 연결되지 않았습니다.');
        return;
      }
      if (!confirm('메뉴를 삭제하시겠습니까?')) return;
      
      try {
        const { error } = await supabase
          .from('menus')
          .delete()
          .eq('id', menuId);
        
        if (error) throw error;
        
        await loadData();
        render();
      } catch (error) {
        alert('삭제 실패: ' + error.message);
      }
    }

    function bindStarRatingEvents() {
      const stars = document.querySelectorAll('#starRating button[data-star]');
      stars.forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const star = parseFloat(btn.dataset.star || '0');
          const rect = btn.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const v = clickX <= rect.width / 2 ? (star - 0.5) : star;
          if (v > 0) {
            currentRatingValue = v;
            renderStarRating();
          }
        });
      });
    }

    function renderStarRating() {
      const stars = document.querySelectorAll('#starRating button[data-star]');
      stars.forEach((btn) => {
        const v = parseFloat(btn.dataset.star || '0');
        btn.classList.remove('filled', 'half');
        if (currentRatingValue >= v) {
          btn.classList.add('filled');
        } else if (currentRatingValue >= (v - 0.5)) {
          btn.classList.add('half');
        }
      });
      const text = document.getElementById('ratingValueText');
      text.textContent = `${formatRating(currentRatingValue)} ★`;
    }

    function showStoreRatingModal(storeId) {
      const store = data.stores.find(s => s.id === storeId);
      if (!store) return;
      currentStoreId = storeId;
      currentMenuId = null;
      currentRatingTarget = 'store';
      currentRatingValue = 5;
      document.getElementById('ratingModalTitle').textContent = '가게 별점 입력';
      document.getElementById('ratingMenuName').textContent = `${store.name}`;
      renderStarRating();
      document.getElementById('ratingModal').classList.add('active');
    }

    function showRatingModal(storeId, menuId) {
      const store = data.stores.find(s => s.id === storeId);
      if (!store) return;
      const menu = store.menus.find(m => m.id === menuId);
      if (!menu) return;

      currentStoreId = storeId;
      currentMenuId = menuId;
      currentRatingTarget = 'menu';
      currentRatingValue = 5;
      document.getElementById('ratingModalTitle').textContent = '메뉴 별점 입력';
      document.getElementById('ratingMenuName').textContent = `${store.name} - ${menu.name}`;
      renderStarRating();
      document.getElementById('ratingModal').classList.add('active');
    }

    async function saveRating() {
      if (!supabase) {
        alert('Supabase가 연결되지 않았습니다.');
        return;
      }
      
      const rating = currentRatingValue;
      
      const btn = document.getElementById('saveRatingBtn');
      btn.disabled = true;
      btn.textContent = '저장 중...';
      
      try {
        let error = null;
        if (currentRatingTarget === 'store') {
          await supabase
            .from('store_ratings')
            .delete()
            .eq('store_id', currentStoreId);
          const result = await supabase
            .from('store_ratings')
            .insert({
              store_id: currentStoreId,
              rating,
              rated_at: new Date().toISOString().split('T')[0]
            });
          error = result.error;
        } else {
          const result = await supabase
            .from('ratings')
            .insert({ menu_id: currentMenuId, rating, rated_at: new Date().toISOString().split('T')[0] });
          error = result.error;
        }
        
        if (error) throw error;
        
        closeModal('ratingModal');
        await loadData();
        render();
      } catch (error) {
        alert('저장 실패: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '저장';
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
      }
    });

    bindStarRatingEvents();
    renderStarRating();

    async function bootstrap() {
      await initializeSupabase();
      await loadData();
      render();
    }

    bootstrap();
  </script>
</body>
</html>
